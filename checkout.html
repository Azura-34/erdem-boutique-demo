<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Siparişi Tamamla — Erdem Boutique</title><link rel="stylesheet" href="styles.css"></head><body><header class="header"><a class="logo" href="index.html">ERDEM<small>BOUTIQUE</small></a><nav><a href="index.html">Ana Sayfa</a><a href="shop.html">Koleksiyon</a></nav><div class="actions"><a class="cart" href="cart.html">♧<b id="cartCount">0</b></a></div></header><main class="section checkout-page"><div><p class="eyebrow">SİPARİŞ</p><h1>Siparişi Tamamla</h1><form id="checkoutForm" class="checkout-form"><label>Ad Soyad<input id="customer_name" required></label><label>Telefon<input id="customer_phone" type="tel" required></label><label>E-posta<input id="customer_email" type="email" required></label><label>Adres<textarea id="address" rows="5" required></textarea></label><label class="consent"><input id="consent" type="checkbox" required> Mesafeli satış ve gizlilik metinlerini okudum, kabul ediyorum.</label><button class="btn full">Siparişi Oluştur →</button><div id="checkoutError" class="error"></div></form></div><aside id="summary" class="checkout-summary"></aside></main><script src="catalog.js"></script><script src="app.js"></script><script>async function go(){let p=await products(),c=getCart();if(!c.length){location.href='cart.html';return}let total=c.reduce((s,x)=>{let q=p.find(z=>z.slug===x.slug);return s+(q?q.price*x.qty:0)},0);summary.innerHTML='<p class="eyebrow">SİPARİŞ ÖZETİ</p><h2>'+fmt(total)+'</h2>'+c.map(x=>{let q=p.find(z=>z.slug===x.slug);return '<div class="summary-item"><span>'+esc(q.name)+' × '+x.qty+'</span><b>'+fmt(q.price*x.qty)+'</b></div>'}).join('')+'<p class="payment-note">Ödeme altyapısı: iyzico entegrasyonu yarın canlıya bağlanacaktır.</p>'}checkoutForm.onsubmit=async e=>{e.preventDefault();checkoutError.textContent='';let items=getCart();try{let r=await fetch('api.php?action=checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_name:customer_name.value,customer_phone:customer_phone.value,customer_email:customer_email.value,address:address.value,items})});let d=await r.json();if(!d.ok)throw Error(d.error||'Sipariş oluşturulamadı');localStorage.removeItem('erdemCart');location.href='order-success.html?order='+encodeURIComponent(d.order_no)}catch(err){checkoutError.textContent=err.message}};go();</script></body></html>
